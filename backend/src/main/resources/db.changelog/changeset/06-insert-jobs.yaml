databaseChangeLog:
  - changeSet:
      id: 06-insert-jobs-data
      author: recruitment-team
      changes:
        - sql:
            splitStatements: true
            endDelimiter: ";"
            sql: |
              INSERT INTO jobs (id, department_id, title, slug, job_level, employment_type, location, salary_min, salary_max, is_salary_negotiable, experience_years, quantity, description, requirements, benefits, deadline, status, created_by) VALUES
              (1, 1, 'Senior Java Backend Engineer (Spring Boot / Microservices)', 'senior-java-backend-engineer', 'Senior', 'Full-time', 'Hà Nội (Hybrid)', 30000000, 50000000, FALSE, '3-5 năm', 3,
              'Tham gia thiết kế và xây dựng các hệ thống Core Backend tải lớn với Spring Boot, PostgreSQL và Kafka. Tối ưu hóa hiệu năng, bảo mật và khả năng mở rộng của hệ thống.',
              '- Tối thiểu 3 năm kinh nghiệm lập trình Java, thành thạo Spring Boot, Spring Security, JPA/Hibernate.
              - Nắm vững kiến trúc Microservices, Docker, Redis, Message Broker (Kafka/RabbitMQ).
              - Tư duy Clean Architecture, CI/CD, viết Unit/Integration Tests tốt.',
              '- Mức lương hấp dẫn từ 30–50 triệu VNĐ + Thưởng dự án & tháng 13.
              - Chế độ bảo hiểm sức khỏe cao cấp cho nhân viên và người thân.
              - Review lương 2 lần/năm, làm việc hybrid 2 ngày WFH/tuần.',
              '2026-12-31', 'PUBLISHED', 2),

              (2, 1, 'Frontend Developer (React / TypeScript / Next.js)', 'frontend-developer-react-ts', 'Middle', 'Full-time', 'Hà Nội / Hồ Chí Minh', 18000000, 30000000, FALSE, '2 năm', 2,
              'Xây dựng các giao diện web hiện đại, phản hồi nhanh (Responsive Web App) với React, TypeScript và Tailwind CSS. Phối hợp chặt chẽ với UI/UX Designer và Backend team.',
              '- Có ít nhất 2 năm kinh nghiệm ReactJS, TypeScript, Tailwind CSS.
              - Hiểu sâu về React Hooks, State Management, RESTful API.
              - Tinh thần trách nhiệm cao, tỉ mỉ về UI/UX và tối ưu trải nghiệm người dùng.',
              '- Môi trường làm việc trẻ trung, sáng tạo, trang bị Macbook Pro.
              - Phụ cấp ăn trưa, gửi xe, du lịch thường niên hàng năm.',
              '2026-12-31', 'PUBLISHED', 2),

              (3, 2, 'Senior Digital Marketing Specialist', 'senior-digital-marketing-specialist', 'Senior', 'Full-time', 'Hà Nội', 20000000, 35000000, FALSE, '3 năm', 1,
              'Lập kế hoạch và thực thi các chiến dịch Performance Marketing trên Meta Ads, Google Ads, TikTok Ads. Tối ưu chi phí CPA, CAC và ROI.',
              '- 3 năm kinh nghiệm chạy chiến dịch Performance ngân sách lớn.
              - Kỹ năng phân tích số liệu với Google Analytics 4, Looker Studio.
              - Sáng tạo nội dung và khả năng A/B testing liên tục.',
              '- Lương cứng 20-35 triệu + KPI thưởng hiệu quả chiến dịch không giới hạn.
              - Cơ hội thăng tiến lên Marketing Lead trong vòng 1 năm.',
              '2026-12-31', 'PUBLISHED', 2),

              (4, 1, 'DevOps / Cloud Platform Engineer (AWS / Kubernetes)', 'devops-cloud-platform-engineer', 'Middle', 'Full-time', 'Hà Nội', 25000000, 45000000, FALSE, '2-4 năm', 2,
              'Quản lý hạ tầng đám mây trên AWS, xây dựng pipeline CI/CD tự động, vận hành cụm Kubernetes (EKS) và giám sát hệ thống với Prometheus/Grafana.',
              '- Kinh nghiệm với Docker, Kubernetes, Terraform/Ansible.
              - Quản trị Linux vững vàng, thành thạo CI/CD (GitHub Actions/GitLab CI).',
              '- Cơ hội làm việc trực tiếp với các chuyên gia cloud, tài trợ 100% chi phí thi chứng chỉ AWS/CKA.',
              '2026-12-31', 'PUBLISHED', 2),

              (5, 6, 'Product Owner / Lead Business Analyst', 'product-owner-lead-ba', 'Senior', 'Full-time', 'Hà Nội', 28000000, 42000000, FALSE, '3-5 năm', 1,
              'Định hình Product Vision, thu thập phân tích yêu cầu nghiệp vụ phần mềm tuyển dụng, viết User Story và quản lý Product Backlog cùng Scrum team.',
              '- Tối thiểu 3 năm kinh nghiệm BA hoặc Product Owner trong mảng Enterprise SaaS.
              - Kỹ năng giao tiếp xuất sắc, vẽ wireframe & workflow bằng Figma/Draw.io.',
              '- Thưởng nóng theo tiến độ phát hành sản phẩm.
              - Tham gia các khóa đào tạo Agile/Scrum chuyên nghiệp.',
              '2026-12-31', 'PUBLISHED', 2),

              (6, 8, 'Automation QA / QC Engineer (Selenium / Postman / JMeter)', 'automation-qa-qc-engineer', 'Middle', 'Full-time', 'Hà Nội', 16000000, 26000000, FALSE, '2 năm', 2,
              'Viết kịch bản kiểm thử tự động cho hệ thống REST API và giao diện Web. Thực hiện kiểm thử tải (Performance/Load Test) đảm bảo khả năng chịu tải cao.',
              '- Thành thạo Selenium, Cypress hoặc Playwright; có kinh nghiệm test API với Postman.
              - Biết viết script cơ bản với Java hoặc JavaScript.',
              '- Đầy đủ chế độ BHXH, BHYT, gói khám sức khỏe tổng quát VIP hàng năm.',
              '2026-12-31', 'PUBLISHED', 2),

              (7, 9, 'Senior AI / Machine Learning Engineer (CV Parsing & Matching)', 'senior-ai-ml-engineer', 'Senior', 'Full-time', 'Hà Nội (Hybrid)', 35000000, 65000000, FALSE, '3+ năm', 2,
              'Nghiên cứu và triển khai mô hình NLP / LLM để tự động bóc tách thông tin từ CV (PDF/Word), tính điểm độ phù hợp tương thích giữa hồ sơ và JD tin tuyển dụng.',
              '- Thành thạo Python, PyTorch/TensorFlow, NLP, LangChain, vector database (Milvus/Pinecone).
              - Có kinh nghiệm fine-tune LLM và triển khai mô hình lên môi trường Production.',
              '- Mức đãi ngộ cạnh tranh lên đến 65 triệu VNĐ cùng cổ phần thưởng ESOP.',
              '2026-12-31', 'PUBLISHED', 2),

              (8, 4, 'Chuyên viên Tuyển dụng & Thu hút Nhân tài (Talent Acquisition)', 'talent-acquisition-specialist', 'Junior', 'Full-time', 'Hà Nội', 12000000, 18000000, FALSE, '1-2 năm', 2,
              'Tìm kiếm, kết nối và sàng lọc ứng viên các vị trí khối Công nghệ thông tin và Kinh doanh. Quản lý toàn bộ vòng đời trải nghiệm của ứng viên.',
              '- Có 1 năm kinh nghiệm Headhunt hoặc Internal Recruiter ngành IT.
              - Năng động, kỹ năng đàm phán và thuyết phục tốt.',
              '- Thưởng hoa hồng tuyển dụng hấp dẫn theo từng vị trí onboard thành công.',
              '2026-12-31', 'PUBLISHED', 2),

              (9, 3, 'Chuyên viên Kinh doanh Khách hàng Doanh nghiệp (B2B Sales)', 'b2b-corporate-sales-executive', 'Middle', 'Full-time', 'Hà Nội / HCM', 15000000, 30000000, TRUE, '1-3 năm', 3,
              'Tư vấn và cung cấp giải pháp chuyển đổi số quản trị tuyển dụng RMS cho các tập đoàn, doanh nghiệp quy mô lớn tại Việt Nam.',
              '- Có kinh nghiệm bán phần mềm B2B (SaaS, ERP, CRM).
              - Tự tin trong thuyết trình, đàm phán hợp đồng thương mại.',
              '- Lương cơ bản + hoa hồng doanh số không giới hạn (thu nhập trung bình 30-50 triệu/tháng).',
              '2026-12-31', 'PUBLISHED', 2),

              (10, 6, 'UI/UX Product Designer (Figma / Design System)', 'ui-ux-product-designer', 'Middle', 'Full-time', 'Hà Nội', 20000000, 32000000, FALSE, '2-3 năm', 1,
              'Xây dựng Design System đồng nhất, thiết kế giao diện cho 3 Portal (Public, Candidate, ATS Admin) trực quan, hiện đại và chuẩn Accessibility.',
              '- Thành thạo Figma, Design Tokens, tạo Prototype tương tác cao.
              - Có portfolio thực tế các dự án Web App phức tạp.',
              '- Môi trường làm việc cởi mở, tự do sáng tạo phong cách thiết kế mang bản sắc riêng.',
              '2026-12-31', 'PUBLISHED', 2)
              ON CONFLICT (id) DO NOTHING;

