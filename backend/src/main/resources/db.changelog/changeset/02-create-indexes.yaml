databaseChangeLog:
  - changeSet:
      id: 02-create-performance-indexes
      author: recruitment-team
      changes:
        - sql:
            splitStatements: true
            endDelimiter: ";"
            sql: |
              CREATE INDEX IF NOT EXISTS idx_jobs_status_deadline ON jobs(status, deadline);
              CREATE INDEX IF NOT EXISTS idx_jobs_department ON jobs(department_id);
              CREATE INDEX IF NOT EXISTS idx_applications_job ON applications(job_id);
              CREATE INDEX IF NOT EXISTS idx_applications_candidate ON applications(candidate_id);
              CREATE INDEX IF NOT EXISTS idx_applications_status ON applications(current_status);
              CREATE INDEX IF NOT EXISTS idx_interviews_scheduled_at ON interviews(scheduled_at);
              CREATE INDEX IF NOT EXISTS idx_notifications_user_read ON notifications(user_id, is_read);
              CREATE INDEX IF NOT EXISTS idx_saved_jobs_candidate ON saved_jobs(candidate_id);

