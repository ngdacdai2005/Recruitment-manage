databaseChangeLog:
  - changeSet:
      id: 17-create-positions-and-employees-tables
      author: dacdai
      validCheckSum:
        - "1:any"
      changes:
        - sql:
            splitStatements: true
            endDelimiter: ";"
            sql: |
              -- 1. Bảng Chức danh / Vị trí công việc (positions)
              CREATE TABLE IF NOT EXISTS positions (
                  id BIGSERIAL PRIMARY KEY,
                  name VARCHAR(100) NOT NULL,
                  code VARCHAR(50) UNIQUE NOT NULL,
                  description TEXT,
                  department_id INT REFERENCES departments(id) ON DELETE SET NULL,
                  is_active BOOLEAN DEFAULT TRUE,
                  created_at TIMESTAMP WITH TIME ZONE DEFAULT CURRENT_TIMESTAMP,
                  updated_at TIMESTAMP WITH TIME ZONE DEFAULT CURRENT_TIMESTAMP
              );

              -- 2. Bảng Hồ sơ nhân viên (employees)
              CREATE TABLE IF NOT EXISTS employees (
                  id BIGSERIAL PRIMARY KEY,
                  user_id BIGINT UNIQUE NOT NULL REFERENCES users(id) ON DELETE CASCADE,
                  employee_code VARCHAR(20) UNIQUE NOT NULL,
                  short_name VARCHAR(50),
                  phone VARCHAR(20) NOT NULL,
                  gender INT NOT NULL DEFAULT 1,
                  dob DATE,
                  address TEXT,
                  avatar VARCHAR(500),
                  profile TEXT,
                  cccd VARCHAR(12) UNIQUE,
                  cccd_issue_date DATE,
                  cccd_issue_place VARCHAR(255),
                  bank_account VARCHAR(50),
                  bank_name VARCHAR(100),
                  join_date DATE NOT NULL,
                  contract_type VARCHAR(20) NOT NULL DEFAULT 'OFFICIAL',
                  contract_start_date DATE,
                  contract_end_date DATE,
                  department_id INT REFERENCES departments(id) ON DELETE SET NULL,
                  position_id BIGINT REFERENCES positions(id) ON DELETE SET NULL,
                  status INT NOT NULL DEFAULT 1,
                  is_delete BOOLEAN NOT NULL DEFAULT FALSE,
                  created_at TIMESTAMP WITH TIME ZONE DEFAULT CURRENT_TIMESTAMP,
                  updated_at TIMESTAMP WITH TIME ZONE DEFAULT CURRENT_TIMESTAMP,
                  created_by BIGINT REFERENCES users(id) ON DELETE SET NULL,
                  updated_by BIGINT REFERENCES users(id) ON DELETE SET NULL
              );

              -- 3. Tạo Indexes tối ưu tìm kiếm
              CREATE INDEX IF NOT EXISTS idx_employees_employee_code ON employees(employee_code);
              CREATE INDEX IF NOT EXISTS idx_employees_phone ON employees(phone);
              CREATE INDEX IF NOT EXISTS idx_employees_department_id ON employees(department_id);
              CREATE INDEX IF NOT EXISTS idx_employees_position_id ON employees(position_id);
              CREATE INDEX IF NOT EXISTS idx_employees_status ON employees(status);
              CREATE INDEX IF NOT EXISTS idx_employees_is_delete ON employees(is_delete);

