databaseChangeLog:
  - changeSet:
      id: 01-create-core-tables
      author: recruitment-team
      validCheckSum:
        - "9:a9c8e1db198f2ca51560c56bf5a399dc"
        - "9:4b3ea36768372751362a7f1cf2833082"
        - "1:any"
      changes:
        - sql:
            splitStatements: true
            endDelimiter: ";"
            sql: |
              -- 1. Roles & RBAC
              CREATE TABLE IF NOT EXISTS roles (
                  id SERIAL PRIMARY KEY,
                  name VARCHAR(50) UNIQUE NOT NULL,
                  description VARCHAR(255)
              );

              -- 2. Users (Accounts)
              CREATE TABLE IF NOT EXISTS users (
                  id BIGSERIAL PRIMARY KEY,
                  email VARCHAR(150) UNIQUE NOT NULL,
                  password_hash VARCHAR(255) NOT NULL,
                  full_name VARCHAR(150) NOT NULL,
                  phone VARCHAR(20),
                  avatar_url VARCHAR(500),
                  role_id INT NOT NULL REFERENCES roles(id) ON DELETE RESTRICT,
                  is_active BOOLEAN DEFAULT TRUE,
                  created_at TIMESTAMP WITH TIME ZONE DEFAULT CURRENT_TIMESTAMP,
                  updated_at TIMESTAMP WITH TIME ZONE DEFAULT CURRENT_TIMESTAMP
              );

              -- 3. Departments
              CREATE TABLE IF NOT EXISTS departments (
                  id SERIAL PRIMARY KEY,
                  name VARCHAR(100) NOT NULL,
                  code VARCHAR(50) UNIQUE NOT NULL,
                  description TEXT,
                  manager_id BIGINT REFERENCES users(id) ON DELETE SET NULL,
                  is_active BOOLEAN DEFAULT TRUE,
                  created_at TIMESTAMP WITH TIME ZONE DEFAULT CURRENT_TIMESTAMP
              );

              -- 4. Job Postings
              CREATE TABLE IF NOT EXISTS jobs (
                  id BIGSERIAL PRIMARY KEY,
                  department_id INT NOT NULL REFERENCES departments(id) ON DELETE CASCADE,
                  title VARCHAR(200) NOT NULL,
                  slug VARCHAR(250) UNIQUE NOT NULL,
                  job_level VARCHAR(50) NOT NULL,
                  employment_type VARCHAR(50) NOT NULL,
                  location VARCHAR(150) NOT NULL,
                  salary_min NUMERIC(12, 2),
                  salary_max NUMERIC(12, 2),
                  is_salary_negotiable BOOLEAN DEFAULT FALSE,
                  experience_years VARCHAR(50),
                  quantity INT DEFAULT 1,
                  description TEXT NOT NULL,
                  requirements TEXT NOT NULL,
                  benefits TEXT NOT NULL,
                  deadline DATE NOT NULL,
                  status VARCHAR(30) DEFAULT 'DRAFT' NOT NULL,
                  created_by BIGINT REFERENCES users(id),
                  created_at TIMESTAMP WITH TIME ZONE DEFAULT CURRENT_TIMESTAMP,
                  updated_at TIMESTAMP WITH TIME ZONE DEFAULT CURRENT_TIMESTAMP
              );

              -- 5. Candidates
              CREATE TABLE IF NOT EXISTS candidates (
                  id BIGSERIAL PRIMARY KEY,
                  user_id BIGINT UNIQUE NOT NULL REFERENCES users(id) ON DELETE CASCADE,
                  full_name VARCHAR(150) NOT NULL,
                  email VARCHAR(150) NOT NULL,
                  phone VARCHAR(20),
                  address VARCHAR(255),
                  date_of_birth DATE,
                  headline VARCHAR(200),
                  summary TEXT,
                  current_cv_url VARCHAR(500),
                  created_at TIMESTAMP WITH TIME ZONE DEFAULT CURRENT_TIMESTAMP,
                  updated_at TIMESTAMP WITH TIME ZONE DEFAULT CURRENT_TIMESTAMP
              );

              -- 6. Candidate Skills
              CREATE TABLE IF NOT EXISTS candidate_skills (
                  id BIGSERIAL PRIMARY KEY,
                  candidate_id BIGINT NOT NULL REFERENCES candidates(id) ON DELETE CASCADE,
                  skill_name VARCHAR(100) NOT NULL,
                  proficiency_level VARCHAR(50)
              );

              -- 7. Candidate Experiences
              CREATE TABLE IF NOT EXISTS candidate_experiences (
                  id BIGSERIAL PRIMARY KEY,
                  candidate_id BIGINT NOT NULL REFERENCES candidates(id) ON DELETE CASCADE,
                  company_name VARCHAR(200) NOT NULL,
                  position VARCHAR(150) NOT NULL,
                  start_date DATE NOT NULL,
                  end_date DATE,
                  is_current BOOLEAN DEFAULT FALSE,
                  description TEXT
              );

              -- 8. Candidate Educations
              CREATE TABLE IF NOT EXISTS candidate_educations (
                  id BIGSERIAL PRIMARY KEY,
                  candidate_id BIGINT NOT NULL REFERENCES candidates(id) ON DELETE CASCADE,
                  institution VARCHAR(200) NOT NULL,
                  degree VARCHAR(100),
                  field_of_study VARCHAR(150),
                  graduation_year INT
              );

              -- 9. Job Applications
              CREATE TABLE IF NOT EXISTS applications (
                  id BIGSERIAL PRIMARY KEY,
                  candidate_id BIGINT NOT NULL REFERENCES candidates(id) ON DELETE CASCADE,
                  job_id BIGINT NOT NULL REFERENCES jobs(id) ON DELETE RESTRICT,
                  resume_url VARCHAR(500) NOT NULL,
                  resume_filename VARCHAR(255),
                  cover_letter TEXT,
                  expected_salary NUMERIC(12, 2),
                  available_date DATE,
                  current_status VARCHAR(50) DEFAULT 'APPLIED' NOT NULL,
                  rejection_reason TEXT,
                  created_at TIMESTAMP WITH TIME ZONE DEFAULT CURRENT_TIMESTAMP,
                  updated_at TIMESTAMP WITH TIME ZONE DEFAULT CURRENT_TIMESTAMP,
                  CONSTRAINT uq_candidate_job UNIQUE (candidate_id, job_id)
              );

              -- 10. Application History
              CREATE TABLE IF NOT EXISTS application_history (
                  id BIGSERIAL PRIMARY KEY,
                  application_id BIGINT NOT NULL REFERENCES applications(id) ON DELETE CASCADE,
                  from_status VARCHAR(50),
                  to_status VARCHAR(50) NOT NULL,
                  note TEXT,
                  rejection_reason TEXT,
                  changed_by BIGINT REFERENCES users(id),
                  created_at TIMESTAMP WITH TIME ZONE DEFAULT CURRENT_TIMESTAMP
              );

              -- 11. Interviews
              CREATE TABLE IF NOT EXISTS interviews (
                  id BIGSERIAL PRIMARY KEY,
                  application_id BIGINT NOT NULL REFERENCES applications(id) ON DELETE CASCADE,
                  interviewer_id BIGINT NOT NULL REFERENCES users(id),
                  scheduled_at TIMESTAMP WITH TIME ZONE NOT NULL,
                  duration_minutes INT DEFAULT 60,
                  interview_type VARCHAR(50) DEFAULT 'ONLINE',
                  location_or_link VARCHAR(500),
                  notes TEXT,
                  status VARCHAR(50) DEFAULT 'SCHEDULED',
                  created_at TIMESTAMP WITH TIME ZONE DEFAULT CURRENT_TIMESTAMP
              );

              -- 12. Interview Evaluations
              CREATE TABLE IF NOT EXISTS interview_evaluations (
                  id BIGSERIAL PRIMARY KEY,
                  interview_id BIGINT UNIQUE NOT NULL REFERENCES interviews(id) ON DELETE CASCADE,
                  technical_score INT CHECK (technical_score >= 1 AND technical_score <= 10),
                  communication_score INT CHECK (communication_score >= 1 AND communication_score <= 10),
                  problem_solving_score INT CHECK (problem_solving_score >= 1 AND problem_solving_score <= 10),
                  teamwork_score INT CHECK (teamwork_score >= 1 AND teamwork_score <= 10),
                  general_notes TEXT,
                  result VARCHAR(30) DEFAULT 'PENDING' NOT NULL,
                  submitted_by BIGINT REFERENCES users(id),
                  created_at TIMESTAMP WITH TIME ZONE DEFAULT CURRENT_TIMESTAMP
              );

              -- 13. Saved Jobs
              CREATE TABLE IF NOT EXISTS saved_jobs (
                  id BIGSERIAL PRIMARY KEY,
                  candidate_id BIGINT NOT NULL REFERENCES candidates(id) ON DELETE CASCADE,
                  job_id BIGINT NOT NULL REFERENCES jobs(id) ON DELETE CASCADE,
                  created_at TIMESTAMP WITH TIME ZONE DEFAULT CURRENT_TIMESTAMP,
                  CONSTRAINT uq_saved_candidate_job UNIQUE (candidate_id, job_id)
              );

              -- 14. Notifications
              CREATE TABLE IF NOT EXISTS notifications (
                  id BIGSERIAL PRIMARY KEY,
                  user_id BIGINT NOT NULL REFERENCES users(id) ON DELETE CASCADE,
                  title VARCHAR(200) NOT NULL,
                  content TEXT NOT NULL,
                  type VARCHAR(50),
                  is_read BOOLEAN DEFAULT FALSE,
                  link_url VARCHAR(500),
                  created_at TIMESTAMP WITH TIME ZONE DEFAULT CURRENT_TIMESTAMP
              );

              -- 15. Audit Logs
              CREATE TABLE IF NOT EXISTS audit_logs (
                  id BIGSERIAL PRIMARY KEY,
                  user_id BIGINT REFERENCES users(id) ON DELETE SET NULL,
                  action VARCHAR(100) NOT NULL,
                  entity_name VARCHAR(100) NOT NULL,
                  entity_id VARCHAR(100),
                  details TEXT,
                  ip_address VARCHAR(50),
                  created_at TIMESTAMP WITH TIME ZONE DEFAULT CURRENT_TIMESTAMP
              );

